# Sitio estático: no necesita build
[build]
  publish = "."

[[redirects]]
  from = "/plataforma-interna"
  to = "/plataforma-interna.html"
  status = 200

[[redirects]]
  from = "/metodologia"
  to = "/metodologia.html"
  status = 200

[[headers]]
  for = "/plataforma-interna*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
