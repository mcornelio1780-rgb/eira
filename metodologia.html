      <a href="index.html#faq" data-i18n="nav.faq"></a>
    </nav>
    <div class="lang" role="group" aria-label="Idioma / Language / Idioma">
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="pt">PT</button>

    </button>
  </div>
</header>

<main id="inicio">
  <section class="page-hero">
    <div class="wrap">
      <a class="back-link" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span data-i18n="mp.back"></span></a>

  <section id="metodo" style="padding-top:clamp(32px,5vw,56px)">
    <div class="wrap">
      <h2 data-i18n="m.title" class="sr"></h2>
      <p class="lede" data-i18n="m.sub"></p>
      <div class="eira-grid">
        <div class="cycle" id="cycle"></div>
        <div>
          <div class="step-btns" id="stepBtns" role="group"></div>
          <div class="step-detail" id="stepDetail" aria-live="polite"></div>
        </div>
      </div>

      <div class="charts">
        <div class="card">
          <h3 data-i18n="m.mixTitle"></h3>
          <p class="sub" data-i18n="m.mixSub"></p>
          <div class="mini-tabs" id="mixTabs" role="group"></div>
          <div class="donut-wrap">
            <div id="donut"></div>
            <ul class="legend" id="legend"></ul>
          </div>
          <p class="note" data-i18n="m.ref"></p>
        </div>
        <div class="card">
          <h3 data-i18n="m.funTitle"></h3>
          <p class="sub" data-i18n="m.funSub"></p>
          <div id="funnel" style="margin-top:14px"></div>
        </div>
        <div class="card wide">
          <h3 data-i18n="m.ganttTitle"></h3>
          <p class="sub" data-i18n="m.ganttSub"></p>
          <div class="scroll-x"><div class="gantt" id="gantt"></div></div>
        </div>
        <div class="card wide">
          <h3 data-i18n="m.kpiTitle"></h3>
          <p class="sub" data-i18n="m.kpiSub"></p>
          <div class="kpis" id="kpis"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="final" style="padding-top:0">
    <div class="wrap">
      <h2 data-i18n="mp.ctaTitle"></h2>
      <p class="lede" data-i18n="mp.ctaSub"></p>
      <div class="hero-ctas">
        <a class="btn btn-wa wa-link" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>

        </a>
        <a class="btn btn-ghost" href="index.html#cotizar" data-i18n="hero.cta1"></a>
      </div>
    </div>
