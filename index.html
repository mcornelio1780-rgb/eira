<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eira Social Media | Contenido que conecta, marcas que inspiran</title>
<meta name="description" content="Agencia de social media: estrategia, gestión de redes, creación de contenido y publicidad digital a la medida de tu marca.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#inicio" aria-label="Eira Social Media">
      <img src="assets/img/logo.png" alt="" width="40" height="40" style="border-radius:50%;box-shadow:0 0 0 1px var(--line)"><span>eira</span>
    </a>
    <nav class="links" id="nav">
      <a href="#servicios" data-i18n="nav.services"></a>
      <a href="metodologia.html" data-i18n="nav.method"></a>
      <a href="#trabajos" data-i18n="nav.work"></a>
      <a href="#resultados" data-i18n="nav.results"></a>
      <a href="#cotizar" data-i18n="nav.quote"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </nav>
    <div class="lang" role="group" aria-label="Idioma / Language / Idioma">
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="pt">PT</button>
    </div>
    <a class="btn btn-primary" href="#cotizar" data-i18n="nav.cta"></a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>

<main id="inicio">
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <h1 data-i18n="hero.title"></h1>
        <p class="lede" data-i18n="hero.sub"></p>
        <div class="hero-ctas">
          <a class="btn btn-primary" href="#cotizar" data-i18n="hero.cta1"></a>
          <a class="btn btn-ghost wa-link" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>
            <span data-i18n="hero.cta2"></span>
          </a>
        </div>
        <p class="hero-note">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
          <span data-i18n="hero.note"></span>
        </p>
      </div>
      <div class="feed" aria-hidden="true">
        <div class="feed-head">
          <img class="avatar" src="assets/img/logo.png" alt="">
          <div><b>@tumarca</b><span data-i18n="hero.feed"></span></div>
        </div>
        <div id="tiles" style="display:contents"></div>
        <div class="feed-stats">
          <div><b data-i18n="hero.s1v"></b><span data-i18n="hero.s1"></span></div>
          <div><b data-i18n="hero.s2v"></b><span data-i18n="hero.s2"></span></div>
          <div><b data-i18n="hero.s3v"></b><span data-i18n="hero.s3"></span></div>
        </div>
      </div>
    </div>
  </section>

  <section id="perfiles" style="padding-top:0">
    <div class="wrap">
      <h2 data-i18n="prof.title"></h2>
      <p class="lede" data-i18n="prof.sub"></p>
      <div class="tabs" role="tablist" id="profTabs"></div>
      <div class="profile-panel" role="tabpanel" id="profPanel" aria-live="polite"></div>
    </div>
  </section>

  <section class="services" id="servicios">
    <div class="wrap">
      <h2 data-i18n="svc.title"></h2>
      <p class="lede" data-i18n="svc.sub"></p>
      <div class="svc-list" id="svcList"></div>
    </div>
  </section>

  <section id="trabajos" style="padding-top:0">
    <div class="wrap">
      <h2 data-i18n="w.title"></h2>
      <p class="lede" data-i18n="w.sub"></p>
      <div class="work-grid" id="work"></div>
    </div>
  </section>

  <section id="resultados" style="padding-top:0">
    <div class="wrap">
      <h2 data-i18n="r.title"></h2>
      <p class="lede" data-i18n="r.sub"></p>
      <div class="results-grid" id="cases"></div>
      <h3 class="brands-title" data-i18n="r.brands"></h3>
      <p class="brands-sub" data-i18n="r.brandsSub"></p>
      <div class="brands" id="brands"></div>
    </div>
  </section>

  <section class="quote" id="cotizar">
    <div class="wrap quote-grid">
      <div>
        <h2 data-i18n="q.title"></h2>
        <p class="lede" data-i18n="q.sub"></p>
        <div class="why" id="why"></div>
      </div>
      <div class="qform" id="qform">
        <div class="progress" id="progress"><i></i><i></i><i></i><i></i><i></i></div>
        <div id="qbody"></div>
        <p class="err" id="qerr" role="alert"></p>
        <div class="qnav">
          <button type="button" class="btn btn-ghost" id="qback"></button>
          <button type="button" class="btn btn-primary" id="qnext"></button>
        </div>
      </div>
    </div>
  </section>

  <section id="faq">
    <div class="wrap">
      <h2 data-i18n="f.title"></h2>
      <div class="faq-list" id="faqList"></div>
    </div>
  </section>

  <section class="final" style="padding-top:0">
    <div class="wrap">
      <h2 data-i18n="end.title"></h2>
      <p class="lede" data-i18n="end.sub"></p>
      <div class="hero-ctas">
        <a class="btn btn-wa wa-link" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>
          <span data-i18n="end.cta"></span>
        </a>
        <a class="btn btn-ghost" href="#cotizar" data-i18n="hero.cta1"></a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <div>
      <div class="logo" style="font-size:1.3rem"><img src="assets/img/logo.png" alt="" width="44" height="44" style="border-radius:50%;box-shadow:0 0 0 1px var(--line)"><span>eira social media</span></div>
      <p data-i18n="foot.tag" style="margin-top:6px;max-width:44ch"></p>
    </div>
    <div class="foot-links">
      <a href="https://www.instagram.com/eira_socialmedia/" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
        @eira_socialmedia
      </a>
      <a class="wa-link" href="#" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Z"/></svg>
        +51 944 376 685
      </a>
      <button class="theme-btn" type="button" id="themeBtn"></button>
    </div>
  </div>
</footer>

<a class="wa-float wa-link" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>
</a>

<script src="assets/js/app.js"></script>
</body>
</html>
